name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check formatting
        run: node scripts/check-format.mjs

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
        suite: [unit, integration]
    steps:
      - name: Show toolchain
        run: node --version
      - name: Run ${{ matrix.suite }} tests
        run: node scripts/run-tests.mjs ${{ matrix.suite }}
      - name: Verify build
        run: node --check src/cart.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Release
        run: echo "Releasing storefront"
